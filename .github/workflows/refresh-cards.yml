name: Refresh profile cards

on:
  schedule:
    - cron: '37 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-cards.yml'
      - 'scripts/**'
      - 'fonts/**'

concurrency:
  group: profile-cards

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Render and publish updated cards
        run: |
          python3 scripts/render_readme_cards.py
          git add -- cards data/contributions.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile cards'
          git push origin HEAD:main
